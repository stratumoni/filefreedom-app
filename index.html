<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <title>FileFreedom: free file tools that run in your browser</title>
    <meta name="description" content="Compress, resize, convert and inspect files with free tools. Supported operations run on your device, so the file never has to be uploaded." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ff:theme');
        if (t === 'light' || t === 'dark' || t === 'dim') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>FileFreedom processes files with JavaScript in your browser, so it needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
